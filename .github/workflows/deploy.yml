name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Vite reads env at build time. Either add secrets NEXT_PUBLIC_SUPABASE_*, VITE_SUPABASE_*,
      # or one secret SUPABASE_SET_UP: JSON {"url":"...","key":"..."} or two lines (URL then key).
      - name: Resolve Supabase env for Vite
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SET_UP: ${{ secrets.SUPABASE_SET_UP }}
        run: |
          set -e
          URL="${NEXT_PUBLIC_SUPABASE_URL:-}"
          KEY="${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
          if [ -z "$URL" ]; then URL="${VITE_SUPABASE_URL:-}"; fi
          if [ -z "$KEY" ]; then KEY="${VITE_SUPABASE_ANON_KEY:-}"; fi

          if { [ -z "$URL" ] || [ -z "$KEY" ]; } && [ -n "${SUPABASE_SET_UP:-}" ]; then
            if echo "$SUPABASE_SET_UP" | jq -e . >/dev/null 2>&1; then
              URL=$(echo "$SUPABASE_SET_UP" | jq -r '.url // .NEXT_PUBLIC_SUPABASE_URL // empty')
              KEY=$(echo "$SUPABASE_SET_UP" | jq -r '.key // .anon // .publishable // .NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY // empty')
            else
              URL=$(printf '%s\n' "$SUPABASE_SET_UP" | sed -n '1p' | tr -d '\r' | xargs)
              KEY=$(printf '%s\n' "$SUPABASE_SET_UP" | sed -n '2p' | tr -d '\r' | xargs)
            fi
          fi

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::Supabase URL/key missing. Add NEXT_PUBLIC_SUPABASE_URL + NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY, or SUPABASE_SET_UP (JSON url/key or two lines)."
            exit 0
          fi

          {
            echo "NEXT_PUBLIC_SUPABASE_URL<<__TANGLE_ENV__"
            echo "$URL"
            echo "__TANGLE_ENV__"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY<<__TANGLE_ENV__"
            echo "$KEY"
            echo "__TANGLE_ENV__"
            echo "VITE_SUPABASE_URL<<__TANGLE_ENV__"
            echo "$URL"
            echo "__TANGLE_ENV__"
            echo "VITE_SUPABASE_ANON_KEY<<__TANGLE_ENV__"
            echo "$KEY"
            echo "__TANGLE_ENV__"
          } >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
